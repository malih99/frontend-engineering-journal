# Single place for every threshold the CLI uses. Change here, not in code.
program:
  start: 2026-10-07          # 15 Mehr 1405
  end: 2027-03-20            # 29 Esfand 1405
  timezone: Asia/Tehran
  week_starts_on: saturday
  rest_days: [friday]        # rest days never break a streak

# Daily target in minutes (matches the 24-week plan).
targets:
  daily_minutes:
    coding: 60
    study: 30
    english: 30
    typing: 15
  typing_wpm: 60
  typing_accuracy: 96

# Consistency level = focused minutes / daily target.
levels:
  minimum: 0.30
  good: 0.60
  excellent: 0.85

# A day is "valid" (counts for streak and active days) when:
valid_day:
  min_learning_minutes: 20   # coding + study
  require_learned_note: true

# Self-reported AI usage -> independence index. Adjust if you disagree.
ai_weights:
  independent: 1.0
  hint: 0.7
  explained: 0.4
