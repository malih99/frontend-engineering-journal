# Closing criteria for every topic (all four must hold before status: closed):
#   1. I can explain it in two minutes, in English, without notes.
#   2. I can implement it from scratch without help.
#   3. I have three real examples (own code or work project; never employer code in this repo).
#   4. I can answer its review questions correctly a week later.
#
# status: todo | active | closed   (closed needs closed_on: YYYY-MM-DD)
phases:
  - id: javascript
    title: JavaScript
    weeks: [1, 4]
    topics:
      - {id: functions, title: Functions, status: active}
      - {id: scope-closure, title: Scope and closure, status: todo}
      - {id: this-binding, title: "this, call, apply, bind", status: todo}
      - {id: array-methods, title: Array methods, status: todo}
      - {id: objects, title: Objects and prototypes, status: todo}
      - {id: async-js, title: Async JavaScript, status: todo}
      - {id: promises, title: Promises and async/await, status: todo}
      - {id: event-loop, title: Event loop, status: todo}

